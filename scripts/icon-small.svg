<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Wariant tej samej ikony na 16 px. Przy tej skali nitki siatki i linie końcowe zlewają się
    w pomarańczową plamę, więc zostaje sama piłka z dwoma szwami - w pasku kart czyta się to
    od razu. Używa tego wyłącznie scripts/make-icons.mjs; w przeglądarce działa app/icon.svg.
  -->
  <defs>
    <linearGradient id="podkosz-icon-small" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffc47d" />
      <stop offset="0.5" stop-color="#ff7a18" />
      <stop offset="1" stop-color="#ff3d00" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#0a0a0f" />

  <g stroke="url(#podkosz-icon-small)" fill="none" stroke-linecap="round">
    <circle cx="32" cy="32" r="20" stroke-width="6" />
    <path d="M32 12v40M12 32h40" stroke-width="3.6" />
  </g>
</svg>
