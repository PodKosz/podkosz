# =====================================================================
#  Codzienna kopia zapasowa bazy
#
#  DLACZEGO TO W OGÓLE ISTNIEJE
#
#  Darmowy plan Supabase nie robi ŻADNYCH kopii zapasowych. Nie „rzadkich" ani
#  „tygodniowych" - żadnych. Jedno nieopatrzne `delete` albo `drop` i nie ma z czego wrócić,
#  a razem z bazą znikają konta ludzi, ich ulubione boiska i historia gry.
#
#  Codzienne kopie z siedmiu dni wstecz są dopiero w planie Pro ($25). To jest tańszy
#  zamiennik na czas, gdy siedzimy na darmowym: ten sam efekt, zero złotówek.
#
#  GDZIE LĄDUJE KOPIA
#
#  Na razie jako artefakt przebiegu GitHub Actions. To nie jest docelowe miejsce i nie
#  udaje, że jest: artefakty wygasają, a przy większej bazie zjadłyby limit repozytorium.
#  Docelowo ma to iść do Cloudflare R2 - patrz krok „Wyślij do R2" na końcu, wystarczy
#  wtedy dopisać trzy sekrety i zdjąć `if: false`.
#
#  CZEGO TA KOPIA NIE ZAŁATWIA
#
#  Zdjęć. Te leżą w magazynie plików, nie w bazie, i `pg_dump` ich nie widzi - w kopii
#  są wyłącznie ścieżki do nich. Zdjęcia zabezpiecza osobno przeniesienie na R2.
# =====================================================================

name: Kopia zapasowa bazy

on:
  schedule:
    # 03:30 UTC, czyli w nocy naszego czasu i z dala od budzika bazy o 06:00.
    # GitHub potrafi odpalić zadanie z opóźnieniem przy dużym obciążeniu - tu to nie szkodzi.
    - cron: "30 3 * * *"
  # Ręczne uruchomienie: zakładka Actions → ten workflow → „Run workflow".
  # Konieczne, żeby dało się sprawdzić kopię od razu, a nie czekać do nocy.
  workflow_dispatch:

jobs:
  kopia:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Sprawdzamy KSZTAŁT sekretu, nie tylko jego obecność - i to nie jest nadgorliwość.
      #
      # `pg_dump`, dostawszy coś, co nie wygląda na adres URI, traktuje to jako NAZWĘ BAZY
      # i puka do lokalnego gniazda uniksowego. Wtedy w dzienniku ląduje:
      #
      #   connection to server on socket "/var/run/postgresql/.s.PGSQL.5432" failed:
      #   No such file or directory
      #
      # czyli komunikat, który wygląda na awarię serwera Postgresa, a nie na źle wklejony
      # sekret - i wysyła szukającego w zupełnie złą stronę. Zdarzyło się dokładnie to przy
      # pierwszym uruchomieniu. Taniej jest powiedzieć prawdę tutaj.
      #
      # Niczego tu nie wypisujemy poza ogonem adresu (host, port, baza). Hasło stoi PRZED
      # ostatnim „@", więc obcięcie do `##*@` zostawia wyłącznie rzeczy jawne.
      - name: Sprawdź, czy sekret jest ustawiony
        env:
          ADRES_BAZY: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$ADRES_BAZY" ]; then
            echo "::error::Brak sekretu SUPABASE_DB_URL. Ustaw go w Settings → Secrets and variables → Actions."
            echo "Weź go z Supabase: Connect → Direct → Session pooler."
            exit 1
          fi

          if [ "$ADRES_BAZY" != "$(printf '%s' "$ADRES_BAZY" | tr -d '\r\n')" ]; then
            echo "::error::SUPABASE_DB_URL zawiera znak nowej linii. Wklej adres jako JEDNĄ linię, bez entera na końcu."
            exit 1
          fi

          case "$ADRES_BAZY" in
            postgresql://*|postgres://*) ;;
            *)
              echo "::error::SUPABASE_DB_URL nie zaczyna się od postgresql:// ani postgres://."
              echo "pg_dump uzna taki tekst za nazwę bazy i spróbuje połączyć się lokalnie - stąd mylące „No such file or directory”."
              echo "Najczęstsze przyczyny: skopiowany sam host zamiast całego adresu, cudzysłowy dokoła wartości, albo spacja na początku."
              exit 1
              ;;
          esac

          case "$ADRES_BAZY" in
            *'[YOUR-PASSWORD]'*|*'[TWOJE-HASŁO]'*)
              echo "::error::W adresie został znacznik [YOUR-PASSWORD] - trzeba go zastąpić prawdziwym hasłem do bazy."
              echo "Hasła nie da się podejrzeć po utworzeniu; można je zresetować w Supabase (Database → Reset database password)."
              exit 1
              ;;
          esac

          # Znaki specjalne w haśle to najcichsza z tutejszych pułapek, bo adres wygląda
          # wtedy POPRAWNIE, a mimo to nie działa - i dostajemy „password authentication
          # failed", czyli komunikat sugerujący złe hasło, a nie zły zapis adresu:
          #
          #   „#" i wszystko po nim libpq ucina jako fragment   -> hasło obcięte w połowie
          #   „?" zaczyna parametry zapytania                   -> jak wyżej
          #   „/" kończy część z hasłem                         -> jak wyżej
          #   „@" rozcina adres w złym miejscu                  -> zły host albo złe hasło
          #
          # Supabase ostrzega o tym pod polem („percent-encode them in the connection
          # string"), ale ostrzeżenie łatwo przeoczyć. Liczba „@" jest tu najpewniejszym
          # sygnałem: w poprawnym adresie jest DOKŁADNIE jedna, ta przed hostem.
          MALPY=$(printf '%s' "$ADRES_BAZY" | tr -cd '@' | wc -c)
          if [ "$MALPY" -ne 1 ]; then
            echo "::error::Adres zawiera $MALPY znaków „@”, a powinien dokładnie jeden (ten przed hostem)."
            echo "Jeśli hasło zawiera „@”, trzeba je zapisać jako %40 - albo prościej: zresetować hasło na takie z samych liter i cyfr."
            exit 1
          fi

          case "${ADRES_BAZY%@*}" in
            *'#'*|*'?'*)
              echo "::error::Hasło w adresie zawiera „#” albo „?”. Te znaki ucinają adres w połowie, więc do serwera trafia niepełne hasło."
              echo "Zakoduj je procentowo (%23 i %3F) albo zresetuj hasło na takie z samych liter i cyfr."
              exit 1
              ;;
          esac

          echo "Sekret jest i wygląda na adres URI. Cel: ${ADRES_BAZY##*@}"

      # pg_dump MUSI być w wersji nie starszej niż serwer, inaczej odmawia zrzutu
      # („server version mismatch"). Domyślny klient na runnerze bywa starszy od bazy
      # Supabase, więc bierzemy najnowszy z oficjalnego repozytorium PostgreSQL -
      # nowszy klient poradzi sobie ze starszym serwerem, odwrotnie nie.
      - name: Zainstaluj klienta PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

          # ZAINSTALOWANIE NIE WYSTARCZY, ŻEBY BYŁO UŻYWANE - i na tym się przejechaliśmy.
          #
          # Na runnerze siedzi już `postgresql-client-16`, a `/usr/bin/pg_dump` to nakładka
          # Debiana, która sama wybiera wersję. Po doinstalowaniu 17 dalej uruchamiała 16,
          # więc krok nazywał się „Zainstaluj klienta PostgreSQL 17", instalacja kończyła
          # się sukcesem, a zrzut padał na:
          #
          #   pg_dump: error: aborting because of server version mismatch
          #   detail: server version: 17.6; pg_dump version: 16.15
          #
          # Dlatego katalog z siedemnastką ląduje NA POCZĄTKU PATH dla kolejnych kroków.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

          # I sprawdzamy, że to naprawdę zadziałało, zamiast wierzyć na słowo. Bez tego
          # ta sama pułapka wróci po cichu przy najbliższej zmianie obrazu runnera.
          WERSJA=$(/usr/lib/postgresql/17/bin/pg_dump --version | grep -o '[0-9]\+' | head -1)
          echo "pg_dump na PATH po zmianie: $WERSJA"
          if [ "$WERSJA" -lt 17 ]; then
            echo "::error::Spodziewałem się pg_dump 17, a jest $WERSJA. Zrzut nowszego serwera by się nie udał."
            exit 1
          fi

      - name: Zrzuć bazę
        env:
          ADRES_BAZY: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          NAZWA="podkosz-$(date -u +%Y-%m-%d).dump"
          echo "NAZWA=$NAZWA" >> "$GITHUB_ENV"

          # -Fc  format własny Postgresa: skompresowany i czytelny dla `pg_restore`,
          #      w dodatku pozwala odtworzyć pojedynczą tabelę zamiast całości.
          # --no-owner  właściciele obiektów różnią się między projektami Supabase
          #      i przy odtwarzaniu tylko przeszkadzają. Uprawnień (`grant execute ...
          #      to anon`) NIE zdejmujemy - role `anon` i `authenticated` istnieją
          #      w każdym projekcie, a bez tych nadań połowa strony przestałaby działać.
          pg_dump -Fc --no-owner --file "$NAZWA" "$ADRES_BAZY"

          echo "Gotowe: $NAZWA ($(du -h "$NAZWA" | cut -f1))"

      # Zrzut, którego nie da się odtworzyć, jest gorszy niż brak zrzutu - bo usypia
      # czujność. `pg_restore --list` czyta spis treści pliku: jeśli jest uszkodzony
      # albo pusty, poznamy to tutaj, a nie w dniu awarii.
      - name: Sprawdź, czy kopia da się odczytać
        run: |
          set -euo pipefail
          POZYCJI=$(pg_restore --list "$NAZWA" | grep -c "^[0-9]" || true)
          echo "Obiektów w kopii: $POZYCJI"
          if [ "$POZYCJI" -lt 50 ]; then
            echo "::error::Kopia ma tylko $POZYCJI obiektów - to za mało jak na tę bazę. Coś poszło nie tak."
            exit 1
          fi
          echo "Kopia wygląda kompletnie."

      - name: Zachowaj kopię
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAZWA }}
          path: ${{ env.NAZWA }}
          retention-days: 30
          if-no-files-found: error

      # ------------------------------------------------------------------ docelowe miejsce
      # Włączyć, gdy R2 będzie gotowe: zdjąć `if: false` i dodać trzy sekrety
      # (R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY) oraz kubełek `kopie`.
      # Wtedy kopie przestają wygasać razem z artefaktami i leżą poza GitHubem.
      - name: Wyślij do R2
        if: false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          KONTO: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          aws s3 cp "$NAZWA" "s3://kopie/$NAZWA" \
            --endpoint-url "https://${KONTO}.r2.cloudflarestorage.com"
