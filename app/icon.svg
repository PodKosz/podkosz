<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Ikona w karcie przeglądarki. Logo z nagłówka (całe boisko z góry) rozmywa się przy 16 px,
    więc zostaje z niego to, co czytelne w miniaturze: piłka w kole środkowym między dwiema
    liniami końcowymi. Kolory te same co w marce - pomarańczowy gradient na ciemnej płytce.
  -->
  <defs>
    <linearGradient id="podkosz-icon" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffc47d" />
      <stop offset="0.5" stop-color="#ff7a18" />
      <stop offset="1" stop-color="#ff3d00" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#0a0a0f" />

  <g stroke="url(#podkosz-icon)" fill="none" stroke-linecap="round">
    <!-- linie końcowe boiska -->
    <path d="M7.5 15.5v33M56.5 15.5v33" stroke-width="3.4" opacity=".55" />
    <!-- piłka w kole środkowym -->
    <circle cx="32" cy="32" r="17" stroke-width="4.6" />
    <path d="M32 15v34M15 32h34" stroke-width="2.4" opacity=".95" />
    <path d="M20.6 19.4c6 6.6 6 19 0 25.2M43.4 19.4c-6 6.6-6 19 0 25.2" stroke-width="2.2" opacity=".9" />
  </g>
</svg>
